<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre Canal+</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Registre Canal+</h1>

    <form id="clientForm">

        <input type="text" id="nom" placeholder="Nom du client" required>

        <input type="text" id="telephone" placeholder="Téléphone" required>

        <input type="text" id="bouquet" placeholder="Bouquet Canal+" required>

        <input type="text" id="code" placeholder="Numéro de Code" required>

        <button type="submit">Ajouter</button>

    </form>


    <h2>Liste des clients</h2>

    <table border="1">

        <thead>
            <tr>
                <th>Nom</th>
                <th>Téléphone</th>
                <th>Bouquet Canal+</th>
                <th>Numéro de Code</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="clientTableBody">
        </tbody>

    </table>


    <script src="script.js"></script>

</body>
</html>
