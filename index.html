<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre Clients Canal+</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Registre des Clients Canal+</h1>

    <div class="actions">

        <input type="text" id="recherche" placeholder="Rechercher un client...">

        <p>Nombre de clients : <span id="compteur">0</span></p>

    </div>


    <form id="clientForm">

        <input type="text" id="nom" placeholder="Nom du client" required>

        <input type="text" id="telephone" placeholder="Numéro de téléphone" required>

        <input type="text" id="bouquet" placeholder="Bouquet Canal+" required>

        <input type="date" id="dateDebut" required>

        <button type="submit">Ajouter</button>

    </form>


    <table>

        <thead>
            <tr>
                <th>Nom</th>
                <th>Téléphone</th>
                <th>Bouquet</th>
                <th>Date début</th>
                <th>Date fin</th>
                <th>Action</th>
            </tr>
        </thead>


        <tbody id="listeClients">

        </tbody>

    </table>

</div>


<script src="script.js"></script>

</body>
</html>
